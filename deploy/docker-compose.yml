# Развёртывание MyKids дома из исходников.
#
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# Без терминала — готовым образом, см. deploy/nas/docker-compose.yml.
#
# После этого родитель открывает http://адрес-этой-машины:3000/, а ребёнок —
# тот же адрес с /child. Отдельного сервера для интерфейса нет: страницы
# отдаёт сам API, и адрес у семьи один.
#
# Данные об активности ребёнка не уходят в чужое облако: всё остаётся на этой
# машине. База живёт во внутренней сети Docker, куда ходит только API, —
# поэтому пароля по умолчанию у неё нет, и .env заводить не обязательно.
#
# Установки до 0.9.1 заводили базу с паролем из deploy/.env. Её настройки
# доступа хранятся в самом томе и не меняются: пока deploy/.env с паролем на
# месте, всё работает как раньше.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mykids}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-mykids}
      # Действует только при первом запуске, когда база заводится.
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mykids}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/vdoma88/mykids-server:local
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mykids}:${POSTGRES_PASSWORD:-}@db:5432/${POSTGRES_DB:-mykids}
      LOG_LEVEL: ${LOG_LEVEL:-warn}
      PORT: 3000
    ports:
      - "${API_PORT:-3000}:3000"
    networks:
      - internal
      - default

volumes:
  db-data:

networks:
  internal:
    internal: true
