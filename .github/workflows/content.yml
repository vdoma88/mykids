name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  content:
    name: Пакеты заданий
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Установка зависимостей
        working-directory: packages/content-tools
        run: npm install --no-audit --no-fund

      - name: Валидация пакетов
        run: node packages/content-tools/bin/validate.js content/packs/*

      # Сгенерированные пакеты не должны расходиться с legacy-источником:
      # если кто-то правит их вручную, следующий импорт молча затрёт правки.
      - name: Сгенерированный контент актуален
        run: |
          node packages/content-tools/bin/import-ukids.js
          node packages/content-tools/bin/build-index.js
          # --porcelain, а не diff: он видит и новые, и удалённые файлы
          if [ -n "$(git status --porcelain -- content/)" ]; then
            echo "::error::content/ расходится с legacy/ukids-app.html — перегенерируйте: npm run import:ukids"
            git status --porcelain -- content/
            exit 1
          fi

  domain:
    name: Доменное ядро
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Установка зависимостей
        run: npm install --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Типы
        run: npm run typecheck
      - name: Тесты
        run: npm test

  server:
    name: Сервер
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mykids_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mykids_test
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/mykids_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Установка зависимостей
        run: npm install --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Клиент Prisma
        run: npx prisma generate
        working-directory: server/api
      - name: Миграции
        run: npx prisma migrate deploy
        working-directory: server/api
      - name: Типы
        run: npx tsc --noEmit
        working-directory: server/api
      - name: Тесты
        run: npx vitest run
        working-directory: server/api

      - name: Сборка админки
        run: npm run build -w @mykids/admin-ui

      - name: Браузер для сквозного теста
        run: npx playwright install --with-deps chromium

      - name: Сквозной тест админки
        run: node e2e.mjs
        working-directory: server/admin-ui
        env:
          DATABASE_URL_E2E: postgresql://postgres:postgres@localhost:5432/mykids_test

      # Агент проверяется против живого API, а не против фальшивого сервера из
      # своих же тестов: только так видно расхождение схем.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Агент против настоящего API
        run: ./integration.sh
        working-directory: agents/windows
        env:
          DATABASE_URL_E2E: postgresql://postgres:postgres@localhost:5432/mykids_test

  image:
    name: Образ сервера
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mykids_image
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4

      # Образ — это то единственное, что семья запускает у себя. Собирать его
      # только у себя на машине значит узнавать о поломке от того, кто пришёл
      # ставить MyKids дома.
      - name: Сборка образа
        run: docker build -f deploy/api.Dockerfile -t mykids-server .

      - name: Запуск
        run: |
          docker run -d --name mykids --network host \
            -e DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/mykids_image \
            -e SESSION_SECRET=проверка-образа \
            -e PORT=3000 mykids-server
          for _ in $(seq 1 60); do
            curl -fsS --max-time 2 http://127.0.0.1:3000/health >/dev/null && exit 0
            sleep 2
          done
          echo "сервер в образе не поднялся:" >&2
          docker logs mykids >&2
          exit 1

      # Образ, который отвечает на /health, но не отдаёт страницу, выглядит
      # рабочим ровно до того момента, когда родитель открывает адрес.
      - name: Интерфейс отдаётся
        run: |
          page=$(curl -fsS -H 'Accept: text/html' http://127.0.0.1:3000/)
          echo "$page" | grep -qi '<div id="root"' || {
            echo "по корневому адресу пришла не страница админки:" >&2
            echo "$page" | head -c 400 >&2; docker logs mykids >&2; exit 1; }

          asset=$(echo "$page" | grep -o '/assets/[^"]*\.js' | head -1)
          [ -n "$asset" ] || { echo "в странице нет ссылки на сборку" >&2; exit 1; }
          curl -fsS -o /dev/null "http://127.0.0.1:3000$asset" || {
            echo "файл сборки $asset не отдаётся" >&2; exit 1; }

          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Accept: text/html' \
                 http://127.0.0.1:3000/agent/sync)
          [ "$code" = 401 ] || { echo "/agent/sync ответил $code вместо 401" >&2; exit 1; }

          # Пакеты заданий в образе: без них ребёнку нечем зарабатывать,
          # и вся экономика держится на ручных начислениях родителя.
          packs=$(curl -fsS http://127.0.0.1:3000/content/packs/index.json) || {
            echo "в образе нет пакетов заданий" >&2; exit 1; }
          echo "$packs" | grep -q '"id"' || {
            echo "каталог пакетов пуст: $packs" >&2; exit 1; }
          echo "образ отдаёт страницы, API и задания"

      - name: Логи при падении
        if: failure()
        run: docker logs mykids || true

  agent:
    name: Windows-агент
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agents/windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Тесты
        run: go test ./...
      - name: Проверки
        run: |
          go vet ./...
          GOOS=windows GOARCH=amd64 go vet ./...
      - name: Сборка exe
        run: ./build.sh

      # Два настоящих процесса. Юнит-тесты проверяют протокол и учёт по
      # отдельности; здесь видно то, что видно только на живом запуске —
      # с какой скоростью списывается время и что снятие помощника счёт
      # не останавливает.
      - name: Служба и помощник вместе
        run: ./two-process-test.sh

      - uses: actions/upload-artifact@v4
        with:
          name: mykids-agent-windows-x64
          path: agents/windows/dist/mykids-agent.exe

  legacy:
    name: Браузерные тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Дымовой тест legacy
        run: node legacy/smoke-test.js

      - name: Сборка раннера
        run: npm run build -w @mykids/task-runner

      - name: Дымовой тест раннера
        run: node packages/task-runner/smoke-test.mjs
