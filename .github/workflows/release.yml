name: Релиз агента

# Тег вида agent-v0.3.0 собирает .exe и выкладывает его релизом.
# Отдельно от CI: тот гоняет тесты на каждый push, а здесь нужен только артефакт,
# который родитель скачает и поставит ребёнку на компьютер.
on:
  push:
    tags: ['agent-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Сборка и релиз
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      # Тесты и здесь: выложить релизом непроверенный бинарник хуже,
      # чем не выложить вовсе.
      - name: Тесты
        run: go test ./...
        working-directory: agents/windows
      - name: Проверки под Windows
        run: GOOS=windows GOARCH=amd64 go vet ./...
        working-directory: agents/windows

      # Версию берём из тега: agent-v0.3.0 -> 0.3.0. Так бинарник и релиз не
      # разъедутся, если кто-то забудет поправить её в исходнике.
      - name: Сборка exe
        run: VERSION="${GITHUB_REF_NAME#agent-v}" ./build.sh
        working-directory: agents/windows
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      # Контрольная сумма: без неё нельзя проверить, что скачался наш файл.
      # tee, а не просто перенаправление: сумму нужно видеть и в логе, чтобы
      # сверить её с тем, что скачали, не распаковывая артефакт.
      - name: Контрольная сумма
        run: sha256sum mykids-agent.exe | tee mykids-agent.exe.sha256
        working-directory: agents/windows/dist

      - uses: actions/upload-artifact@v4
        with:
          name: mykids-agent-windows-x64
          path: |
            agents/windows/dist/mykids-agent.exe
            agents/windows/dist/mykids-agent.exe.sha256

      - name: Релиз
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            agents/windows/dist/mykids-agent.exe
            agents/windows/dist/mykids-agent.exe.sha256
          body_path: agents/windows/RELEASE.md
