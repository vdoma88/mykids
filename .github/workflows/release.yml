name: Релиз агента

# Тег вида agent-v0.3.0 собирает .exe и выкладывает его релизом.
# Отдельно от CI: тот гоняет тесты на каждый push, а здесь нужен только артефакт,
# который родитель скачает и поставит ребёнку на компьютер.
#
# Запуск вручную с указанной версией делает то же самое и создаёт тег сам.
# Это не удобство, а необходимость: пуш тегов доступен не из всякого окружения,
# а у самого workflow право записи есть.
on:
  push:
    tags: ['agent-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия релиза без префикса, например 0.3.0. Пусто — только собрать, без релиза.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Сборка и релиз
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      # Тесты и здесь: выложить релизом непроверенный бинарник хуже,
      # чем не выложить вовсе.
      - name: Тесты
        run: go test ./...
        working-directory: agents/windows
      - name: Проверки под Windows
        run: GOOS=windows GOARCH=amd64 go vet ./...
        working-directory: agents/windows

      # Версия приходит либо из тега (agent-v0.3.0 -> 0.3.0), либо из поля при
      # ручном запуске. Значения подставляем через env, а не в тело скрипта:
      # выражение прямо в run склеивается с командной строкой до запуска.
      - name: Версия
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="${INPUT_VERSION:-${REF_NAME#agent-v}}"
          case "$version" in
            # Ручной запуск без версии оставляет здесь имя ветки. Релизом такое
            # выкладывать нельзя — собираем артефакт и на этом останавливаемся.
            [0-9]*.[0-9]*.[0-9]*)
              echo "release=true" >> "$GITHUB_OUTPUT" ;;
            *)
              version=""
              echo "release=false" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "версия релиза: ${version:-не задана, только сборка}"

      - name: Сборка exe
        run: ./build.sh
        working-directory: agents/windows
        env:
          VERSION: ${{ steps.v.outputs.version }}

      # Контрольная сумма: без неё нельзя проверить, что скачался наш файл.
      # tee, а не просто перенаправление: сумму нужно видеть и в логе, чтобы
      # сверить её с тем, что скачали, не распаковывая артефакт.
      - name: Контрольные суммы
        run: sha256sum mykids-agent.exe mykids-check.exe | tee sha256.txt
        working-directory: agents/windows/dist

      - uses: actions/upload-artifact@v4
        with:
          name: mykids-windows-x64
          path: |
            agents/windows/dist/mykids-agent.exe
            agents/windows/dist/mykids-check.exe
            agents/windows/dist/sha256.txt
            deploy/install-windows.ps1

      # tag_name задан явно: при ручном запуске тега ещё нет, и действие
      # создаёт его на том коммите, который сейчас собрали.
      - name: Релиз
        if: steps.v.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: agent-v${{ steps.v.outputs.version }}
          name: MyKids ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            agents/windows/dist/mykids-agent.exe
            agents/windows/dist/mykids-check.exe
            agents/windows/dist/sha256.txt
            deploy/install-windows.ps1
          body_path: agents/windows/RELEASE.md
