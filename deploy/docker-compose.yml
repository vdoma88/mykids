# Развёртывание MyKids дома.
#
#   cp deploy/.env.example deploy/.env   # и обязательно смените пароль
#   docker compose -f deploy/docker-compose.yml up -d
#
# После этого родитель открывает http://адрес-этой-машины:3000/, а ребёнок —
# тот же адрес с /child. Отдельного сервера для интерфейса нет: страницы
# отдаёт сам API, и адрес у семьи один.
#
# Данные об активности ребёнка не уходят в чужое облако: всё остаётся на этой
# машине. Порт базы наружу не публикуется — к ней ходит только API.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mykids}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте пароль в deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-mykids}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mykids}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mykids}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-mykids}
      SESSION_SECRET: ${SESSION_SECRET:?задайте секрет в deploy/.env}
      PORT: 3000
    ports:
      - "${API_PORT:-3000}:3000"

volumes:
  db-data:
