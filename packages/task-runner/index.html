<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>MyKids — задания</title>
<!-- Стили самих заданий общие с интерфейсом ребёнка: одна копия на обоих. -->
<link rel="stylesheet" href="./src/ui/runner.css"/>
<style>
:root{--bg:#F6F5F2;--surface:#fff;--surface-2:#F1EFEA;--text:#1E1C24;--text-muted:#6A6673;--border:#E3DFD7;
  --border-strong:#CFCAC0;--accent:#5B4BDB;--accent-soft:#EEEBFF;--accent-contrast:#fff;--success:#1F8A5B;
  --success-soft:#E4F4EC;--danger:#C8453B;--danger-soft:#FCE9E7;--radius-md:12px;}
*{box-sizing:border-box;}
body{margin:0;padding:24px;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,'Segoe UI',sans-serif;}
main{max-width:720px;margin:0 auto;}
header{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:20px;}
h1{font-size:22px;margin:0;}
#balance{font-size:13px;color:var(--text-muted);}
#pack-list{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));}
.pack{display:flex;flex-direction:column;gap:2px;text-align:left;padding:14px;border:1px solid var(--border);border-radius:14px;background:var(--surface);cursor:pointer;font:inherit;color:inherit;}
.pack:hover{border-color:var(--accent);}
.pack span{font-size:12px;color:var(--text-muted);}
.card,.summary{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px;margin-top:20px;}
.progress{font-size:12px;color:var(--text-muted);margin:0 0 12px;}
button{font:inherit;font-weight:600;padding:10px 18px;border-radius:12px;border:0;background:var(--accent);color:#fff;cursor:pointer;}
button:disabled{opacity:.5;cursor:not-allowed;}
.feedback{min-height:22px;font-size:14px;color:var(--text-muted);}
.credits-earned strong{color:var(--success);}
.error{background:var(--danger-soft);border:1px solid var(--danger);color:#8A2B41;padding:12px;border-radius:10px;}
</style>
</head>
<body>
<main>
  <header>
    <h1>Задания</h1>
    <p id="balance"></p>
  </header>
  <div id="pack-list"></div>
  <div id="stage"></div>
</main>
<script type="module" src="./dist/app.js"></script>
</body>
</html>
